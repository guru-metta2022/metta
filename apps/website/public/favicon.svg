<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="mettaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Aura Circle -->
  <circle cx="50" cy="50" r="48" fill="#0b0f0e" stroke="#1f3b2f" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="url(#mettaGlow)"/>
  
  <!-- Central Zen Enso arc -->
  <path d="M 50 14 A 36 36 0 1 1 20 28" fill="none" stroke="#2d5e46" stroke-width="3" stroke-linecap="round" stroke-dasharray="210 15"/>
  
  <!-- Center Lotus / Bodhi Leaf Cluster -->
  <!-- Center Leaf -->
  <path d="M 50 25 C 44 38 43 54 50 68 C 57 54 56 38 50 25 Z" fill="url(#leafGrad)"/>
  <!-- Left Petal -->
  <path d="M 50 48 C 36 44 26 54 30 66 C 37 72 46 62 50 56 Z" fill="url(#leafGrad)" opacity="0.85"/>
  <!-- Right Petal -->
  <path d="M 50 48 C 64 44 74 54 70 66 C 63 72 54 62 50 56 Z" fill="url(#leafGrad)" opacity="0.85"/>
  <!-- Base Lotus Pedestal -->
  <path d="M 36 70 C 44 75 56 75 64 70 C 58 73 42 73 36 70 Z" fill="url(#goldGrad)"/>
  
  <!-- Sati Spark (Golden Point of Mindfulness) -->
  <circle cx="50" cy="38" r="2.5" fill="#fef08a"/>
</svg>
