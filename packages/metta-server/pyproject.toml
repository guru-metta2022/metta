[project]
name = "metta-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Guru", email = "guru@omarchyguru.local" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "metta-core",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
metta-server = "metta_server.main:run_server"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
metta-core = { path = "../metta-core" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
