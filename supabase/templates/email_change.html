<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Confirm Your New Metta Email</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0b0d13; color: #e4e7ee; margin: 0; padding: 40px 20px;">
  <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 540px; background-color: #121622; border: 1px solid #232b3e; border-radius: 16px; overflow: hidden; padding: 32px;">
    <tr>
      <td align="center" style="padding-bottom: 24px;">
        <div style="font-size: 28px; line-height: 1;">⚖️</div>
        <h1 style="color: #f0f2f5; font-size: 20px; font-weight: 700; margin: 12px 0 4px 0; letter-spacing: 0.05em;">METTA</h1>
        <p style="color: #7d8799; font-size: 12px; margin: 0;">Canonical Human-AI Harmonious Coexistence</p>
      </td>
    </tr>
    <tr>
      <td style="color: #c9d1df; font-size: 14px; line-height: 1.6; padding-bottom: 24px;">
        <p style="margin: 0 0 16px 0;">Hello,</p>
        <p style="margin: 0 0 16px 0;">Follow this link to confirm your updated email address for your <strong>Metta</strong> account:</p>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-bottom: 28px;">
        <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: linear-gradient(135deg, #1d4030, #2b6147); color: #d1fae5; text-decoration: none; padding: 12px 28px; border-radius: 10px; font-weight: 600; font-size: 14px; border: 1px solid #3d8a63;">Confirm Email Address</a>
      </td>
    </tr>
    <tr>
      <td style="color: #8b95a7; font-size: 12px; line-height: 1.6; padding: 16px; background-color: #0d1018; border-radius: 8px; border: 1px solid #1c2230;">
        <p style="margin: 0 0 8px 0; color: #a5b0c2;">Or enter this verification code:</p>
        <p style="margin: 0; font-size: 18px; font-weight: 700; color: #a7f3d0; letter-spacing: 4px;">{{ .Token }}</p>
      </td>
    </tr>
    <tr>
      <td style="color: #5d6779; font-size: 11px; line-height: 1.5; padding-top: 24px; text-align: center; border-top: 1px solid #1c2230;">
        <p style="margin: 0;">If you did not request this change, please check your Metta account security.</p>
      </td>
    </tr>
  </table>
</body>
</html>
